[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmate"
version = "0.1.0"
description = "Autonomous AI-powered Git commit & push utility."
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aachman Dixit" }]
dependencies = [
    "GitPython>=3.1.43",
    "requests>=2.31.0",
    "openai>=1.30.0",
    "watchdog>=4.0.0",
    "psutil>=5.9.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "keyring>=24.0.0",
]

[project.scripts]
gitmate = "main:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
